# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10","3.11","3.12","3.13","3.14"]
        pandas-version: ["<3","<4"]
        textual-version: [">7,<8",">8"]

    steps:
    - uses: actions/checkout@v6
    - name: Install python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install poetry
      run: python -m pip install poetry
    - name: Install dependencies
      run: python -m poetry install --with dev
    - name: Force install pandas versions
      run: python -m pip install --force-reinstall 'pandas${{ matrix.pandas-version }}'
    - name: Force install textual versions
      run: python -m pip install --force-reinstall 'textual${{ matrix.textual-version }}'
    - name: Run tests
      run: python -m pytest
